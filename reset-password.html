  <style>
    :root {
      --c-bg: #F4F7F2;
      --c-surface: #ffffff;
      --c-border: #E2E8DE;
      --c-grid: #EAF0E6;
      --c-line: #D6DFD3;
      --c-text: #052E22;
      --c-muted: #5B6B62;
      --c-accent: #052E22;   /* verde noche — primary interactive */
      --c-lime: #A3E635;     /* lima neon — highlights / accents */
      --c-avail: #27AE60;
      --c-full:  #E74C3C;
      --font-sans: 'Geomini', system-ui, -apple-system, sans-serif;
      --font-mono: 'Open Sans', system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--c-bg); min-height: 100vh; width: 100%; max-width: 100%; overflow-x: hidden; }
    body { font-family: var(--font-sans); color: var(--c-text); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
    img { max-width: 100%; }
    button { font-family: inherit; }
    @keyframes llamita-fade { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes llamita-spin { to { transform: rotate(360deg); } }
    #root { animation: llamita-fade 0.3s ease-out; }
  </style>
</head>
<body>
  <div id="root">
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;background:#F4F7F2">

    </div>
  </div>

  <script src="/vendor/react.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>

  <script src="/dist/api.js"></script>
  <script src="/dist/analytics.js"></script>
  <script src="/dist/auth.js"></script>
  <script>
    ReactDOM.createRoot(document.getElementById('root'))
      .render(React.createElement(window.LlamitaAuth.ResetPasswordScreen));
  </script>
